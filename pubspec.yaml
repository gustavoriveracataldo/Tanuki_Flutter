name: toonami_viernes_noche_flutter
description: Port Flutter de Toonami Viernes Noche para Android, Windows y Linux.
publish_to: "none"
version: 1.6.23+1623

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  dart_vlc: ^0.4.0
  file_picker: ^11.0.2
  flutter:
    sdk: flutter
  http: ^1.2.2
  media_kit: ^1.2.6
  media_kit_libs_linux: ^1.2.1
  media_kit_libs_video: ^1.0.7
  media_kit_video: ^2.0.1
  path_provider: ^2.1.5
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.1
  video_player: ^2.11.1
  wakelock_plus: ^1.5.2
  webview_all: ^1.2.1
  webview_flutter: ^4.14.0
  webview_flutter_android: ^4.12.0
  youtube_explode_dart: ^3.1.0
dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

dependency_overrides:
  audio_video_progress_bar: ^2.0.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
