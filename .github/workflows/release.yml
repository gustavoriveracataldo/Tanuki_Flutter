name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  TMDB_BEARER_TOKEN: ${{ secrets.TMDB_BEARER_TOKEN }}
  TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
  FANART_API_KEY: ${{ secrets.FANART_API_KEY }}
  MYANIMELIST_CLIENT_ID: ${{ secrets.MYANIMELIST_CLIENT_ID }}
  MYANIMELIST_CLIENT_SECRET: ${{ secrets.MYANIMELIST_CLIENT_SECRET }}
  SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}

jobs:
  validate-secrets:
    name: Validate release secrets
    runs-on: ubuntu-latest

    steps:
      - name: Validate required metadata secrets
        run: |
          missing=0
          if [ -z "${TMDB_API_KEY}${TMDB_BEARER_TOKEN}" ]; then
            echo "::error::Set TMDB_API_KEY or TMDB_BEARER_TOKEN in repository secrets."
            missing=1
          fi
          for key in FANART_API_KEY MYANIMELIST_CLIENT_ID SIMKL_CLIENT_ID; do
            value="$(eval "printf '%s' \"\${$key:-}\"")"
            if [ -z "$value" ]; then
              echo "::error::Set $key in repository secrets."
              missing=1
            fi
          done
          exit "$missing"

  quality:
    name: Analyze and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libepoxy-dev \
            libgtk-3-dev \
            libmpv-dev \
            libvlc-dev \
            vlc

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  android:
    name: Android APK
    runs-on: ubuntu-latest
    needs:
      - validate-secrets
      - quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build APK
        run: |
          sh scripts/build_android.sh

      - name: Package APK
        run: |
          version="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n 1)"
          version_name="${version%%+*}"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/tanuki-android-v${version_name}.apk"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: tanuki-android
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 1

  linux:
    name: Linux x64
    runs-on: ubuntu-24.04
    needs:
      - validate-secrets
      - quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            libepoxy-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            liblzma-dev \
            libmpv-dev \
            libvlc-dev \
            libsoup-3.0-dev \
            ninja-build \
            pkg-config \
            vlc

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Linux
        run: |
          sh scripts/build_linux.sh

      - name: Package Linux bundle
        run: |
          version="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n 1)"
          version_name="${version%%+*}"
          mkdir -p dist
          tar -C build/linux/x64/release -czf "dist/tanuki-linux-x64-v${version_name}.tar.gz" bundle

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: tanuki-linux-x64
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  windows:
    name: Windows x64
    runs-on: windows-latest
    needs:
      - validate-secrets
      - quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Windows
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts\build_release_windows.ps1

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: tanuki-windows-x64
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 1

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs:
      - android
      - linux
      - windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          version="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n 1)"
          version_name="${version%%+*}"
          echo "version_name=${version_name}" >> "$GITHUB_OUTPUT"
          echo "tag_name=v${version_name}" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || steps.version.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: Tanuki Flutter ${{ steps.version.outputs.tag_name }}
          files: release-assets/*
          generate_release_notes: true
